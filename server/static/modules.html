<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<body>
<div class="gs-container stack">

  <div class="glass pad d-flex align-items-center gap-3">
    <button class="btn-gs sm" id="prev">上一页</button>
    <span class="text-muted" id="pageinfo"></span>
    <button class="btn-gs sm" id="next">下一页</button>
  </div>
