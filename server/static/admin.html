<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesellschaft · 管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/gesellschaft.css">
</head>
<body>
<div class="gs-container stack">
  <div class="glass pad mx-auto" style="max-width:420px; margin-top:60px" id="login">
    <h5 class="fw-bold mb-3">管理员登录</h5>
    <div class="mb-3">
      <label class="form-label text-muted small">管理员令牌(GESSELLSCHAFT_ADMIN_TOKEN)</label>
      <input type="password" class="form-control" id="token">
    </div>
    <button class="btn-gs primary" id="login-btn">登录</button>
  </div>
  <div id="panel" style="display:none; flex-direction:column; gap:14px">
    <div class="glass pad">
      <div class="tabs" id="tabs"></div>
      <div id="tab-body" style="padding-top:16px"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
